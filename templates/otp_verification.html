<!DOCTYPE html>
<html>
<head>
    <title>Enter OTP</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e9f8f0;
            font-family: Arial, sans-serif;
        }
        .top-left-home {
            position: absolute;
            top: 10px;
            left: 10px;
            text-decoration: none;
            font-weight: bold;
            color: #1f6d4f;
        }
        .page-box {
            width: 360px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(46, 182, 113, 0.18);
            padding: 32px;
            text-align: center;
        }
        .page-box h2 {
            margin-top: 0;
            color: #1f6d4f;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2b6f52;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #bedfc9;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3eb489;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #2c8b6a;
        }
        .error-message {
            color: #b22f2f;
            background: #fdeaea;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <a class="top-left-home" href="/">start over</a>
    <div class="page-box">
        <h2>OTP Verification</h2>
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        <p>Please enter the 3-character one-time password sent during registration for <strong>{{ username }}</strong>.</p>
        <form method="POST">
            <label for="otp">One-Time Password:</label>
            <input type="text" id="otp" name="otp" maxlength="3" required>
            <button type="submit">Verify OTP</button>
        </form>
    </div>
</body>
</html>

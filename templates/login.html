<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e9f8f0;
            font-family: Arial, sans-serif;
        }
        body.virp-background {
            background-image: url("{{ url_for('static', filename='virp.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        body.virp-background .page-box {
            background: rgba(255, 255, 255, 0.93);
        }
        .top-left-home {
            position: absolute;
            top: 10px;
            left: 10px;
            text-decoration: none;
            font-weight: bold;
            color: #1f6d4f;
        }
        .page-box {
            width: 360px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(46, 182, 113, 0.18);
            padding: 32px;
            text-align: left;
        }
        .page-box h2 {
            margin-top: 0;
            text-align: center;
            color: #1f6d4f;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2b6f52;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #bedfc9;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3eb489;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #2c8b6a;
        }
        .toggle-row {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2b6f52;
            font-size: 14px;
        }
        .toggle-row input {
            width: auto;
            margin: 0;
        }
        .error-message {
            color: #b22f2f;
            background: #fdeaea;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>
<body class="{% if use_vrp_background %}virp-background{% endif %}">
    <a class="top-left-home" href="/">start over</a>
    <div class="page-box">
        <h2>Login Page</h2>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" value="{{ username or '' }}">

            <label>Password:</label>
            <input type="password" name="password">

            <div class="toggle-row">
                <input type="checkbox" name="use_vrp_background" {% if use_vrp_background %}checked{% endif %}>
                <span>Use virp background after login</span>
            </div>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVault - Register</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e9f8f0;
            font-family: Arial, sans-serif;
        }
        .top-left-home {
            position: absolute;
            top: 10px;
            left: 10px;
            text-decoration: none;
            font-weight: bold;
            color: #1f6d4f;
        }
        .page-box {
            width: 360px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(46, 182, 113, 0.18);
            padding: 32px;
        }
        .page-box h1 {
            margin-top: 0;
            text-align: center;
            color: #1f6d4f;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2b6f52;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #bedfc9;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3eb489;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #2c8b6a;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #1f6d4f;
            text-decoration: none;
            display: block;
            margin-top: 10px;
            font-weight: 600;
        }
        .error-message {
            color: #b22f2f;
            background: #fdeaea;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>

<body>
    <a class="top-left-home" href="/">start over</a>

    <div class="page-box">
        <h1>CyberVault Registration</h1>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form id="registerForm" action="/register" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="{{ username or '' }}" required minlength="3">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required minlength="6">

            <button type="submit">Register</button>
        </form>

        <script>
            document.getElementById('registerForm').addEventListener('submit', function(event) {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    alert('Please fill out all fields before registering.');
                    event.preventDefault();
                    return false;
                }

                if (username.length < 3) {
                    alert('Username must be at least 3 characters.');
                    event.preventDefault();
                    return false;
                }

                if (password.length < 6) {
                    alert('Password must be at least 6 characters.');
                    event.preventDefault();
                    return false;
                }
            });
        </script>

        <div class="links">
            <a href="/login">Already have an account? Login here.</a>
            <a href="/">Return to Home</a>
        </div>
    </div>
</body>
</html>

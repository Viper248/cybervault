<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVault - Register</title>
</head>

<body>

    <h1>CyberVault Registration</h1>

    <form action="/register" method="POST">

        <label for="username">Username:</label><br>
        <input
            type="text"
            id="username"
            name="username"
            required
        >
        <br><br>

        <label for="password">Password:</label><br>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <br>

    <a href="/login">Already have an account? Login here.</a>

    <br><br>

    <a href="/">Return to Home</a>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Login Successful</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 80px;
            background: #e9f8f0;
            font-family: Arial, sans-serif;
        }
        body.virp-background {
            background-image: url("{{ url_for('static', filename='virp.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        body.virp-background .page-box {
            background: rgba(255, 255, 255, 0.93);
        }
        .top-left-home {
            position: absolute;
            top: 10px;
            left: 10px;
            text-decoration: none;
            font-weight: bold;
            color: #1f6d4f;
        }
        .page-box {
            width: 360px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(46, 182, 113, 0.18);
            padding: 32px;
            text-align: center;
        }
        .page-box h2 {
            margin-top: 0;
            color: #1f6d4f;
        }
        .page-box p {
            margin: 20px 0;
        }
        .page-box a {
            display: inline-block;
            margin-top: 16px;
            color: #1f6d4f;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body class="{% if use_vrp_background %}virp-background{% endif %}">
    <a class="top-left-home" href="/">Home</a>
    <div class="page-box">
        <h2>Login Successful</h2>
        <p>Welcome back, {{ username }}!</p>
        <a href="/">Go to Home</a>
    </div>
</body>
</html>
